name: Build kernel (AnyKernel3)

# Cloud build of this tree. Produces the AnyKernel3 zip + kernel config as
# Actions artifacts and replaces the dedicated latest-build prerelease.
# Fixed device-verified releases are still published manually and never changed
# by this workflow.
# Every run also attaches the newest successful Manager-release artifact from a
# push to Baka-Su/BakaSU main (never a pull-request build), so the run page is
# a one-stop download for both.
#
# Triggers:
#   - push to ci/** branches: intended for refs that carry no unverified
#     kernel-side changes (e.g. a KernelSU submodule bump) so the cloud
#     builds them while the local machine is idle.
#   - push to the default branch: reproducibility build of released source.
#   - workflow_dispatch: manual run of any branch.
#
# Toolchain: ubuntu-24.04 ships clang 18 / lld 18 in apt, which is what the
# maintained builds use (the compiler banner string is pinned separately in
# build_star.sh, so any clang >= 12 works).

on:
  push:
    branches:
      - 'ci/**'
      - '5.4.274-qgki-4dfe63e0666f'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: star / AnyKernel3
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Check out source (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve pinned KernelSU history and upstream version tags
        run: |
          cd KernelSU
          if [ -f "$(git rev-parse --git-dir)/shallow" ]; then
            git fetch --unshallow origin
          fi
          git fetch --tags https://github.com/ReSukiSU/ReSukiSU.git \
            "+refs/tags/*:refs/tags/*" --quiet

      - name: Check KernelSU and SuSFS interfaces
        run: |
          python3 scripts/check_susfs_compat.py
          python3 -m unittest discover -s scripts/tests -p 'test_susfs_compat.py'

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            zip unzip cpio python3 python-is-python3 \
            clang lld llvm

      - name: Build
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          JOBS=$(nproc) bash build_star.sh

      - name: Package AnyKernel3 zip
        run: bash anykernel3/build.sh

      - name: Fetch the newest upstream Manager APK
        continue-on-error: true
        uses: ./.github/actions/fetch-manager

      - name: Verify and collect fixed-name build bundle
        run: python3 scripts/collect_build_release.py --kind pinned

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anykernel3-${{ github.sha }}
          path: dist/*
          if-no-files-found: error

      - name: Upload Manager APK
        if: hashFiles('manager/*.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: BakaSU-manager
          path: manager/*
          if-no-files-found: warn

  publish:
    name: Replace latest-build prerelease
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    concurrency:
      group: latest-build-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: anykernel3-${{ github.sha }}
          path: release-bundle
      - name: Test release publisher
        run: python3 -m unittest discover -s scripts/tests -p 'test_release_pipeline.py'
      - name: Stage, verify and replace rolling build assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_rolling_release.py --bundle release-bundle
