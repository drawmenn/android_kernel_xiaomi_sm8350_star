name: Build kernel (AnyKernel3)

# Cloud build of this tree. Produces the AnyKernel3 zip + kernel config as
# Actions artifacts; it never creates GitHub releases (staged release
# protocol: releases are cut manually only after device verification).
#
# Triggers:
#   - push to ci/** branches: intended for refs that carry no unverified
#     kernel-side changes (e.g. a KernelSU submodule bump) so the cloud
#     builds them while the local machine is idle.
#   - push to the default branch: reproducibility build of released source.
#   - workflow_dispatch: manual run of any branch (zip_suffix input can
#     name the zip like a release, e.g. "r10").
#
# Artifact naming (matches the release convention star-<release>-AK3-rN):
#   Actions artifact label: star-<kernel-release>-AK3-<suffix>
#   flashable zip inside:  star-<kernel-release>-AK3-<suffix>.zip
#                          (suffix = dispatch input, else short commit sha)
#   config:                config-<kernel-release>
#
# Toolchain: ubuntu-24.04 ships clang 18 / lld 18 in apt, which is what the
# maintained builds use (the compiler banner string is pinned separately in
# build_star.sh, so any clang >= 12 works).

on:
  push:
    branches:
      - 'ci/**'
      - '5.4.274-qgki-4dfe63e0666f'
  workflow_dispatch:
    inputs:
      zip_suffix:
        description: 'Zip name suffix (default: short commit sha), e.g. r10'
        default: ''
        required: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: star / AnyKernel3
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Check out source (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            zip unzip cpio python3 python-is-python3 \
            clang lld llvm

      - name: Build
        run: JOBS=$(nproc) bash build_star.sh

      - name: Compute build identity
        id: vars
        env:
          SUFFIX_INPUT: ${{ inputs.zip_suffix }}
        run: |
          OUT="out-star-5.4.274-qgki-g4dfe63e0666f"
          RELEASE="$(cat "$OUT/include/config/kernel.release")"
          echo "zip_suffix=${SUFFIX_INPUT:-${GITHUB_SHA:0:8}}" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

      - name: Package AnyKernel3 zip
        env:
          ZIP_SUFFIX: ${{ steps.vars.outputs.zip_suffix }}
        run: |
          OUT="out-star-5.4.274-qgki-g4dfe63e0666f"
          RELEASE="$(cat "$OUT/include/config/kernel.release")"
          export PACKAGE_NAME="star-$RELEASE-AK3-$ZIP_SUFFIX"
          bash anykernel3/build.sh

      - name: Collect outputs
        env:
          ZIP_SUFFIX: ${{ steps.vars.outputs.zip_suffix }}
        run: |
          OUT="out-star-5.4.274-qgki-g4dfe63e0666f"
          RELEASE="$(cat "$OUT/include/config/kernel.release")"
          mkdir -p dist
          cp "$OUT/star-$RELEASE-AK3-$ZIP_SUFFIX.zip" dist/
          cp "$OUT/.config" "dist/config-$RELEASE"
          sha256sum dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: star-${{ steps.vars.outputs.release }}-AK3-${{ steps.vars.outputs.zip_suffix }}
          path: dist/*
          if-no-files-found: error
